<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>将领系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f121b;padding:20px;margin:0;}
.back{padding:6px 14px;background:#704c18;border:1px solid #d4a046;border-radius:4px;cursor:pointer;}
h1{color:#ffd06b;margin:20px 0;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.card{background:#171a24;border:1px solid #c9a257;border-radius:8px;padding:14px;}
.name{color:#ffc107;font-size:18px;margin-bottom:8px;}
.btn{margin-top:10px;padding:5px 10px;border-radius:4px;border:none;cursor:pointer;}
.add{background:#16a34a;}
.up{background:#2563eb;}
</style>
</head>
<body>
<div class="back" onclick="location.href='index.html'">返回主地图</div>
<h1>名将招募</h1>
<div class="grid" id="box"></div>

<script src="core.js"></script>
<script>
const pool = [
    {hid:1,name:"张飞",pow:11000,cost:70000},
    {hid:2,name:"黄忠",pow:13000,cost:90000},
    {hid:3,name:"马超",pow:14500,cost:100000},
    {hid:4,name:"刘备",pow:12000,cost:80000}
];

function render(){
    let d = Game.get();
    let html = "";
    pool.forEach(h=>{
        let have = d.generals.find(x=>x.hid===h.hid);
        if(have){
            html += `<div class="card">
                <div class="name">${h.name}</div>
                <div>等级：${have.lv}</div>
                <div>战力：${have.power}</div>
                <button class="btn up" onclick="up(${h.hid})">升级(5万铜钱)</button>
            </div>`;
        }else{
            html += `<div class="card">
                <div class="name">${h.name}</div>
                <div>基础战力：${h.pow}</div>
                <div>招募：${Game.format(h.cost)}铜钱</div>
                <button class="btn add" onclick="add(${h.hid})">招募</button>
            </div>`;
        }
    });
    document.getElementById("box").innerHTML = html;
}

function add(id){
    let d = Game.get();
    let h = pool.find(x=>x.hid===id);
    if(d.resource.gold < h.cost) return alert("铜钱不足！");
    d.resource.gold -= h.cost;
    d.generals.push({hid:h.hid,name:h.name,lv:1,power:h.pow});
    Game.save(d);
    alert("招募成功！");
    render();
}

function up(id){
    let d = Game.get();
    let g = d.generals.find(x=>x.hid===id);
    if(d.resource.gold < 50000) return alert("铜钱不足！");
    d.resource.gold -= 50000;
    g.lv++;
    g.power = Math.floor(g.power*1.15);
    Game.save(d);
    alert("升级成功！");
    render();
}
render();
</script>
</body>
</html>
