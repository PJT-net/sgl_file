<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>将领 - 三国群英传</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;color:#e8e8e8;font-family:Microsoft YaHei;}
        body {background:#0f121b;padding:20px;}
        .back-btn{padding:8px 14px;background:#704c18;border:1px solid #d4a046;border-radius:4px;cursor:pointer;margin-bottom:16px;}
        .container{max-width:1200px;margin:0 auto;}
        h1{color:#ffd06b;margin-bottom:20px;}
        .general-list{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
        .general-card{background:#171a24;border:1px solid #c9a257;border-radius:8px;padding:12px;}
        .general-name{font-size:18px;color:#ffc107;margin-bottom:6px;}
        .attr{font-size:14px;line-height:1.6}
        .recruit-btn{margin-top:8px;padding:5px 10px;background:#16a34a;border-radius:4px;cursor:pointer;}
        .upgrade-btn{margin-top:8px;padding:5px 10px;background:#2563eb;border-radius:4px;cursor:pointer;}
    </style>
</head>
<body>
<div class="container">
    <button class="back-btn" onclick="backToMap()">返回主地图</button>
    <h1>将领寻访｜招募武将</h1>
    <div class="general-list" id="generalDom">
        <!-- JS渲染武将 -->
    </div>
</div>
<script src="./gameCore.js"></script>
<script>
let gameData = GameCore.loadSave();
// 武将池
const heroPool = [
    {hid:1,name:"刘备",basePower:12000,costGold:80000},
    {hid:2,name:"张飞",basePower:11000,costGold:70000},
    {hid:3,name:"黄忠",basePower:13000,costGold:90000},
    {hid:4,name:"马超",basePower:14000,costGold:100000}
]

function backToMap(){
    window.location.href = "index.html";
}

function renderHeroList(){
    let html = "";
    heroPool.forEach(hero=>{
        // 判断是否已经拥有
        const owned = gameData.generals.find(g=>g.hid === hero.hid);
        if(owned){
            html += `
            <div class="general-card">
                <div class="general-name">${hero.name}</div>
                <div class="attr">等级：${owned.lv}<br>战力：${owned.power}</div>
                <button class="upgrade-btn" onclick="upgradeHero(${hero.hid})">升级(消耗5万铜钱)</button>
            </div>`
        }else{
            html += `
            <div class="general-card">
                <div class="general-name">${hero.name}</div>
                <div class="attr">基础战力：${hero.basePower}<br>招募费用：${GameCore.formatNum(hero.costGold)}铜钱</div>
                <button class="recruit-btn" onclick="recruitHero(${hero.hid})">招募</button>
            </div>`
        }
    })
    document.getElementById("generalDom").innerHTML = html;
}

// 招募武将
function recruitHero(hid){
    const hero = heroPool.find(h=>h.hid === hid);
    if(gameData.resource.gold >= hero.costGold){
        gameData.resource.gold -= hero.costGold;
        gameData.generals.push({
            hid:hero.hid,
            name:hero.name,
            lv:1,
            power:hero.basePower
        })
        GameCore.saveSave(gameData);
        alert(`成功招募【${hero.name}】！`);
        renderHeroList();
    }else{
        alert("铜钱不足！");
    }
}

// 升级武将
function upgradeHero(hid){
    const hero = gameData.generals.find(g=>g.hid === hid);
    const cost = 50000;
    if(gameData.resource.gold >= cost){
        gameData.resource.gold -= cost;
        hero.lv += 1;
        hero.power = Math.floor(hero.power * 1.15);
        GameCore.saveSave(gameData);
        alert(`${hero.name}升级成功，战力提升！`);
        renderHeroList();
    }else{
        alert("铜钱不足！");
    }
}

renderHeroList();
</script>
</body>
</html>
