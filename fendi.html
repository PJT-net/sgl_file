<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>封地建设</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f121b;padding:20px;margin:0;}
.back{padding:6px 14px;background:#704c18;border:1px solid #d4a046;border-radius:4px;cursor:pointer;}
h1{color:#ffd06b;margin:20px 0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.card{background:#171a24;border:1px solid #c9a257;border-radius:8px;padding:14px;}
.name{color:#ffc107;font-size:18px;margin-bottom:8px;}
.btn{margin-top:10px;padding:5px 10px;background:#16a34a;border-radius:4px;cursor:pointer;}
</style>
</head>
<body>
<div class="back" onclick="location.href='index.html'">返回主地图</div>
<h1>封地建设</h1>
<div class="grid" id="box"></div>

<script src="core.js"></script>
<script>
const cfg = [
    {key:"gov",name:"官府",desc:"升级主公等级",costLv:lv=>lv*100000},
    {key:"farm",name:"农田",desc:"产出粮草",costLv:lv=>lv*60000},
    {key:"mine",name:"矿场",desc:"产出矿石",costLv:lv=>lv*70000}
];

function render(){
    let d = Game.get();
    let html = "";
    cfg.forEach(b=>{
        let lv = d.buildings[b.key];
        let cost = b.costLv(lv);
        html += `<div class="card">
            <div class="name">${b.name} Lv.${lv}</div>
            <div>${b.desc}</div>
            <div style="margin:6px 0">${lv===0?"建造":"升级"}消耗：${Game.format(cost)}铜钱</div>
            <button class="btn" onclick="build('${b.key}')">${lv===0?"建造":"升级"}</button>
        </div>`;
    });
    document.getElementById("box").innerHTML = html;
}

function build(key){
    let d = Game.get();
    let b = cfg.find(x=>x.key===key);
    let lv = d.buildings[key];
    let cost = b.costLv(lv);
    if(d.resource.gold < cost) return alert("铜钱不足！");

    d.resource.gold -= cost;
    d.buildings[key]++;

    // 官府0→1 升级主公Lv0→Lv1
    if(key==="gov" && lv===0) d.player.level = 1;

    Game.save(d);
    alert("建造成功！");
    render();
}
render();
</script>
</body>
</html>
