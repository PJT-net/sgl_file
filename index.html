<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三国开荒 - 主地图</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;color:#eee;}
body{background:#0f121b;overflow:hidden;user-select:none;}
.top{height:120px;background:linear-gradient(#222633,#171a24);border-bottom:1px solid #444;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;}
.info h2{color:#fff;font-size:17px;}
.info p{color:#ff9b40;margin:4px 0;}
.res{display:flex;gap:20px;font-size:14px;margin-top:6px;}
.btn-top{padding:6px 12px;background:linear-gradient(#9b702c,#704c18);border:1px solid #d4a046;border-radius:4px;cursor:pointer;}
.wrap{display:grid;grid-template-columns:260px 1fr 280px;grid-template-rows:1fr 140px;height:calc(100vh - 120px);}
.left{background:#171a24;border-right:1px solid #333;padding:10px;overflow:auto;}
.map{background:#1a222e;position:relative;}
.right{background:#171a24;border-left:1px solid #333;padding:10px;}
.bottom{grid-column:1/-1;background:#222633;border-top:1px solid #444;padding:10px;display:flex;align-items:center;gap:12px;}
.func{margin-left:auto;display:flex;gap:10px;}
.func-btn{padding:6px 12px;background:#2f3444;border:1px solid #555;border-radius:4px;cursor:pointer;}
.task-item{background:#222633;padding:8px;border-radius:4px;margin-bottom:8px;border-left:3px solid #3b82f6;}
.task-btn{float:right;background:#2563eb;padding:2px 8px;border-radius:3px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>

<div class="top">
    <div class="info">
        <h2><span id="name">新主公</span> <span style="color:#ffc107">VIP0</span></h2>
        <p>Lv.<span id="lv">0</span>｜总战力：<span id="power">0</span></p>
        <div class="res">
            <span>💰 <span id="gold">2.0</span>万</span>
            <span>🌾 <span id="food">1.0</span>万</span>
            <span>🪨 <span id="ore">0.5</span>万</span>
            <span>💎 <span id="diam">30</span></span>
        </div>
    </div>
    <div class="btn-top" onclick="location.href='task.html'">任务系统</div>
</div>

<div class="wrap">
    <div class="left">
        <div style="font-size:15px;border-bottom:1px solid #444;padding-bottom:6px;margin-bottom:10px;">任务列表</div>
        <div id="taskList"></div>
    </div>

    <div class="map"></div>

    <div class="right">
        <div style="font-size:15px;border-bottom:1px solid #444;padding-bottom:6px;margin-bottom:10px;">世界动态</div>
        <div style="font-size:13px;color:#aaa;">等待建筑产出资源...</div>
    </div>

    <div class="bottom">
        <div id="troopText" style="color:#bbb">暂无部队，请先招募武将</div>
        <div class="func">
            <div class="func-btn" onclick="location.href='general.html'">将领</div>
            <div class="func-btn" onclick="location.href='fendi.html'">封地</div>
        </div>
    </div>
</div>

<script src="core.js"></script>
<script>
function refresh(){
    let d = Game.autoRes();
    Game.calcPower();
    d = Game.get();

    document.getElementById("name").innerText = d.player.name;
    document.getElementById("lv").innerText = d.player.level;
    document.getElementById("power").innerText = d.player.power;
    document.getElementById("gold").innerText = Game.format(d.resource.gold);
    document.getElementById("food").innerText = Game.format(d.resource.food);
    document.getElementById("ore").innerText = Game.format(d.resource.ore);
    document.getElementById("diam").innerText = d.resource.diamond;

    let tHtml = "";
    d.taskList.forEach(t=>{
        tHtml += `<div class="task-item">
            <span class="task-btn" onclick="location.href='task.html?id=${t.id}'">前往</span>
            <div style="font-size:13px">${t.name}</div>
        </div>`;
    });
    document.getElementById("taskList").innerHTML = tHtml;

    let troopHtml = d.generals.length ? `拥有武将：${d.generals.length}名` : "暂无武将，请前往将领页面招募";
    document.getElementById("troopText").innerText = troopHtml;
}
setInterval(refresh,1000);
refresh();
</script>
</body>
</html>
