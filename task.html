<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务详情</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f121b;padding:20px;margin:0;}
.back{padding:6px 14px;background:#704c18;border:1px solid #d4a046;border-radius:4px;cursor:pointer;}
.box{max-width:800px;margin:20px auto;background:#171a24;border:1px solid #c9a257;border-radius:8px;padding:20px;}
h1{color:#ffd06b;}
.reward{background:#222633;padding:12px;border-radius:6px;margin:15px 0;}
.btn{padding:8px 16px;background:#16a34a;border-radius:4px;cursor:pointer;}
</style>
</head>
<body>
<div class="back" onclick="location.href='index.html'">返回主地图</div>
<div class="box">
    <h1 id="tName">任务</h1>
    <p id="tDesc"></p>
    <div class="reward" id="tReward"></div>
    <button class="btn" id="btnDo" onclick="done()">完成任务</button>
</div>

<script src="core.js"></script>
<script>
let id = new URLSearchParams(location.search).get("id");
let d = Game.get();
let t = d.taskList.find(x=>x.id==id);

function render(){
    if(!t)return;
    document.getElementById("tName").innerText = t.name;
    document.getElementById("tDesc").innerText = t.desc;

    let str = "";
    if(t.reward.gold) str += "铜钱 "+Game.format(t.reward.gold)+" ";
    if(t.reward.food) str += "粮草 "+Game.format(t.reward.food)+" ";
    if(t.reward.diamond) str += "元宝 "+t.reward.diamond;
    document.getElementById("tReward").innerText = str;

    if(t.done){
        document.getElementById("btnDo").innerText = "已领取";
        document.getElementById("btnDo").disabled = true;
    }
}

function done(){
    if(t.done)return;
    d.resource.gold += t.reward.gold||0;
    d.resource.food += t.reward.food||0;
    d.resource.ore += t.reward.ore||0;
    d.resource.diamond += t.reward.diamond||0;
    t.done = true;
    Game.save(d);
    alert("任务完成！奖励已到账");
    render();
}
render();
</script>
</body>
</html>
